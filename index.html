<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Interactive Marathon Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{ --bg: #0b0f14; --panel: #0e141c; --text: rgba(255,255,255,.92); --muted: rgba(255,255,255,.55); --blue: #5aa6ff; --radius: 16px; }
        * { box-sizing:border-box; }
        body{ margin:0; font-family: 'Inter', sans-serif; color: var(--text); background: #0a0e13; display: grid; place-items: center; min-height: 100vh; padding: 20px; }
        .tablet{ width: min(1000px, 95vw); border-radius: 22px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.1); padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card{ background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: var(--radius); padding: 20px; }
        .title{ font-weight:700; font-size: 14px; color: var(--blue); margin-bottom: 15px; text-transform: uppercase; }
        .field{ margin-bottom: 15px; }
        label{ display:block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
        input{ width:100%; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.2); color: white; padding: 10px; border-radius: 8px; font-weight: 700; }
        .result-box{ background: rgba(90,166,255,.1); padding: 15px; border-radius: 12px; margin-top: 10px; }
        .val{ font-size: 24px; font-weight: 800; display: block; }
    </style>
</head>
<body>

<div class="tablet">
    <div class="grid">
        <div class="card">
            <div class="title">1. Your Baseline</div>
            <div class="field">
                <label>Recent Race Distance (Miles)</label>
                <input type="number" id="dist1" value="3.1" step="0.1">
            </div>
            <div class="field">
                <label>Recent Time (Minutes)</label>
                <input type="number" id="time1" value="25">
            </div>
            <div class="field">
                <label>Target Race Distance (Miles)</label>
                <input type="number" id="dist2" value="26.2" step="0.1">
            </div>
        </div>

        <div class="card">
            <div class="title">2. Predictions</div>
            <div class="result-box">
                <label>Predicted Finish Time</label>
                <span class="val" id="predTime">--:--:--</span>
            </div>
            <div class="result-box">
                <label>Target Pace (Min/Mile)</label>
                <span class="val" id="targetPace">--:--</span>
            </div>
        </div>

        <div class="card">
            <div class="title">3. Training Paces</div>
            <div class="field">
                <label>Easy Run Pace</label>
                <span id="easyPace" style="font-weight:700;">--:--</span>
            </div>
            <div class="field">
                <label>Tempo Run Pace</label>
                <span id="tempoPace" style="font-weight:700;">--:--</span>
            </div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const d1 = parseFloat(document.getElementById('dist1').value);
        const t1 = parseFloat(document.getElementById('time1').value);
        const d2 = parseFloat(document.getElementById('dist2').value);

        if (d1 > 0 && t1 > 0 && d2 > 0) {
            // Riegel Formula Calculation
            const t2 = t1 * Math.pow((d2 / d1), 1.06);
            
            // Format Time
            const hours = Math.floor(t2 / 60);
            const minutes = Math.floor(t2 % 60);
            document.getElementById('predTime').innerText = `${hours}h ${minutes}m`;

            // Calculate Pace
            const paceDec = t2 / d2;
            const paceMin = Math.floor(paceDec);
            const paceSec = Math.round((paceDec - paceMin) * 60);
            document.getElementById('targetPace').innerText = `${paceMin}:${paceSec < 10 ? '0' : ''}${paceSec}`;

            // Suggested Training Paces (Roughly 20% slower for Easy)
            const easy = paceDec * 1.25;
            document.getElementById('easyPace').innerText = `${Math.floor(easy)}:${Math.round((easy % 1) * 60)} min/mile`;
            
            const tempo = paceDec * 1.05;
            document.getElementById('tempoPace').innerText = `${Math.floor(tempo)}:${Math.round((tempo % 1) * 60)} min/mile`;
        }
    }

    // Run calculation whenever a user types
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', calculate);
    });

    // Run once on load
    calculate();
</script>

</body>
</html>
